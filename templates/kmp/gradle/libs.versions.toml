[versions]
agp = "9.0.1"
kotlin = "2.3.21"
compose-multiplatform = "1.11.0"
compose-material3 = "1.11.0-alpha07"
androidx-activity-compose = "1.13.0"
android-minSdk = "24"
android-compileSdk = "36"
android-targetSdk = "35"
particle-emitter = "1.1.0"

[libraries]
# The ParticleEmitter library from Maven Central — shared across every target.
particle-emitter = { module = "io.github.piotrprus:particle-emitter", version.ref = "particle-emitter" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
